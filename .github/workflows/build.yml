# Fork addition: builds the Chromium extension and uploads it as a downloadable artifact.
name: Build Chromium extension

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx webpack --env target=chromium
      - uses: actions/upload-artifact@v4
        with:
          name: consent-o-matic-chromium
          path: build/
          if-no-files-found: error
